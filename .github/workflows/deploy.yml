name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 저장소 Actions 탭에서 손으로 돌릴 수 있게 둔다.
  workflow_dispatch:

# Pages 배포에 필요한 최소 권한. 셋 중 하나라도 빠지면 배포 단계에서 실패한다.
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 것을 취소하지 않는 이유는
# 취소된 배포가 사이트를 중간 상태로 남길 수 있기 때문이다.
# Pages 배포가 멈춘 적이 있다. 그 배포를 취소하면 다음 배포가 막히므로
# 그룹 pages 의 cancel-in-progress 는 false 로 둔다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install
        # 락파일과 어긋나면 실패한다. npm install 은 쓰지 않는다.
        run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Astro check
        run: npm run astro -- check
      - name: Build
        run: npm run build
      - name: Check dist
        run: npm run check:dist
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
