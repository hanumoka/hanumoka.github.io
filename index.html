<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hanumoka</title>
<meta name="description" content="hanumoka의 개인 사이트">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa;
    --fg: #1a1a18;
    --muted: #6b6b66;
    --line: #e3e3df;
    --accent: #2f6f4f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --fg: #e8e8e4;
      --muted: #9a9a94;
      --line: #2c2e33;
      --accent: #7fc4a0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 42rem;
    margin: 0 auto;
    padding: 4rem 1.5rem 5rem;
  }
  h1 {
    font-size: 2rem;
    letter-spacing: -0.02em;
    margin: 0 0 .35rem;
  }
  .tagline { color: var(--muted); margin: 0 0 2.5rem; }
  h2 {
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    font-weight: 600;
    margin: 2.5rem 0 .75rem;
  }
  section > p { margin: 0 0 1rem; }
  ul { margin: 0; padding-left: 1.1rem; }
  li { margin: .3rem 0; }
  a { color: var(--accent); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 3rem 0 1.25rem; }
  footer { color: var(--muted); font-size: .85rem; }
  code {
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: .875em;
    background: color-mix(in srgb, var(--fg) 8%, transparent);
    padding: .1em .35em;
    border-radius: 3px;
  }
  .badge {
    display: inline-block;
    font-size: .75rem;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: .15rem .6rem;
    margin-bottom: 1.5rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <span class="badge">기초 셋팅 확인용 · 2026-09-05</span>

    <h1>hanumoka</h1>
    <p class="tagline">백엔드 개발자. Java · Spring · Kotlin.</p>

    <section>
      <h2>지금 상태</h2>
      <p>
        이 페이지는 GitHub Pages 배포가 실제로 동작하는지 확인하기 위한
        최소 구성입니다. 정적 사이트 생성기는 아직 고르지 않았습니다 —
        빌드 도구 없이 <code>index.html</code> 하나로만 서빙되고 있습니다.
      </p>
    </section>

    <section>
      <h2>앞으로 둘 것</h2>
      <ul>
        <li>기술 글 — 만들면서 부딪힌 것과 그때 잰 값</li>
        <li>프로젝트 기록 — 무엇을 왜 그렇게 만들었는지</li>
      </ul>
    </section>

    <hr>
    <footer>
      <p>
        <a href="https://github.com/hanumoka">github.com/hanumoka</a>
      </p>
    </footer>
  </div>
</body>
</html>
